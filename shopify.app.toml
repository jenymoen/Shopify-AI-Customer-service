# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "27d451d8bc10e529417b9fb0284f3384"
name = "Avento Customer Service"
application_url = "https://shopify-ai-customer-service.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_orders,read_products"

[auth]
redirect_urls = [
  "https://shopify-ai-customer-service.onrender.com/auth/callback",
  "https://shopify-ai-customer-service.onrender.com/auth/shopify/callback",
  "https://shopify-ai-customer-service.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[build]
automatically_update_urls_on_dev = false

